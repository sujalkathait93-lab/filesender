version: '3.8'

services:
  fileshare:
    build:
      context: .
      dockerfile: Dockerfile
    image: fileshare:latest
    container_name: fileshare-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-*}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-2147483648}
      - MAX_REFRESHES_PER_SESSION=${MAX_REFRESHES_PER_SESSION:-5}
      - MAX_PREVIEWS_PER_FILE=${MAX_PREVIEWS_PER_FILE:-100}
      - CLEANUP_INTERVAL_SECONDS=${CLEANUP_INTERVAL_SECONDS:-300}
      - STUN_SERVERS=${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
    volumes:
      - fileshare-db:/app/database
      - fileshare-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fileshare-db:
    driver: local
  fileshare-uploads:
    driver: local
